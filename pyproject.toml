[project]
name = "emend"
dynamic = ["version"]
description = "A Python refactoring CLI tool with structured edits and pattern transforms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MPL-2.0"}
authors = [{name = "Lucas Wiman", email = "lucas.wiman@gmail.com"}]
keywords = ["refactoring", "python", "code-transformation", "libcst"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typer", "libcst", "lark", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "sphinx", "furo"]

[project.urls]
Homepage = "https://github.com/lucaswiman/emend"
Documentation = "https://lucaswiman.github.io/emend/"
Repository = "https://github.com/lucaswiman/emend"
Issues = "https://github.com/lucaswiman/emend/issues"

[project.scripts]
emend = "emend.cli:main"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Python source layout: src/emend/*.py is packaged alongside the Rust extension
python-source = "src"
# Rust extension is compiled from rust/Cargo.toml
manifest-path = "rust/Cargo.toml"
# Place the compiled extension inside the emend package namespace so that
# `from emend import emend_core` works and emend_core is fully bundled
module-name = "emend.emend_core"
features = ["pyo3/extension-module"]
