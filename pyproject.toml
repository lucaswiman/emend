[project]
name = "emend"
dynamic = ["version"]
description = "A Python refactoring CLI tool with structured edits and pattern transforms"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MPL-2.0"}
authors = [{name = "Lucas Wiman", email = "lucas.wiman@gmail.com"}]
keywords = ["refactoring", "python", "code-transformation", "libcst"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typer", "libcst", "lark", "pyyaml", "emend-core"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "sphinx", "furo", "hatch-vcs"]

[project.urls]
Homepage = "https://github.com/lucaswiman/emend"
Documentation = "https://lucaswiman.github.io/emend/"
Repository = "https://github.com/lucaswiman/emend"
Issues = "https://github.com/lucaswiman/emend/issues"

[project.scripts]
emend = "emend.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/emend/_version.py"
