# sqlx (Rust) trace preset.
#
# This preset has no sources -- it is meant to be composed with a framework
# preset (e.g. actix-web or axum) that provides user-input sources.
#
# Note: Rust path-qualified calls like `sqlx::query()` cannot be expressed as
# emend patterns. The patterns below use method-call style that IS matchable.
# Use `$X.execute($Y)` to catch raw SQL execution via any pool or connection
# object.
labels:
  - user_input

sources: []

sinks:
  # Method-call sinks that work with the tree-sitter Rust pattern engine
  - pattern: "$X.execute($Y)"
    label: user_input
    message: "SQL injection: user input in .execute()"
  - pattern: "$X.query($Y)"
    label: user_input
    message: "SQL injection: user input in .query()"
  - pattern: "$X.fetch_all($Y)"
    label: user_input
    message: "SQL injection: user input in .fetch_all()"
  - pattern: "$X.fetch_one($Y)"
    label: user_input
    message: "SQL injection: user input in .fetch_one()"

sanitizers:
  - {pattern: "$X.bind($Y)", label: user_input}
