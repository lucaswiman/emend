# SQL Injection Vulnerability Dataset
#
# Curated dataset of real-world SQL injection CVEs in Python libraries.
# Each entry includes the fix commit so you can check out the parent
# commit (fix_commit~1) to test detection on the vulnerable version.
#
# Sources: NVD, OSV (osv.dev), GitHub Security Advisories

# ==============================================================
# Django — ORM and QuerySet API SQL injection vulnerabilities
# ==============================================================

- cve: CVE-2019-14234
  library: django
  component: JSONField / HStoreField key lookups
  repo: https://github.com/django/django
  fix_commits:
    - "7deeabc7c7526786df6894429ce89a9c4b614086"   # Django main
    - "4f5b58f5cd3c57fee9972ab074f8dc6895d8f387"   # Django 2.2.x
    - "f74b3ae3628c26e1b4f8db3d13a91d52a833a975"   # Django 2.1.x
    - "ed682a24fca774818542757651bfba576c3fc3ef"   # Django 1.11.x
  affected_versions: "<1.11.23, <2.1.11, <2.2.4"
  description: >
    SQL injection via crafted key or index names in JSONField and
    HStoreField lookups. An attacker could pass a malicious key like
    "x]'; DROP TABLE --" through QuerySet.filter() kwargs to inject SQL.
  vulnerable_pattern: >
    filter(**{user_controlled_key: value}) on JSONField/HStoreField
    columns. The key portion (after __) was interpolated into SQL without
    quoting.
  detection_strategy: flow
  emend_rule: django-jsonfield-key-injection

- cve: CVE-2020-7471
  library: django
  component: django.contrib.postgres.aggregates.StringAgg
  repo: https://github.com/django/django
  fix_commits:
    - "eb31d845323618d688ad429479c6dda973056136"   # Django main
    - "505826b469b16ab36693360da9e11fd13213421b"   # Django 3.0.x
    - "c67a368c16e4680b324b4f385398d638db4d8147"   # Django 2.2.x
  affected_versions: "<1.11.28, <2.2.10, <3.0.3"
  description: >
    SQL injection via the delimiter argument to StringAgg. The delimiter
    was treated as a raw SQL literal rather than a parameter, allowing
    injection through crafted delimiter strings.
  vulnerable_pattern: >
    StringAgg('field', delimiter=user_input) where user_input is not
    a Value() wrapped string.
  detection_strategy: flow
  emend_rule: django-stringagg-delimiter-injection

- cve: CVE-2020-9402
  library: django
  component: django.contrib.gis (GIS functions/aggregates)
  repo: https://github.com/django/django
  fix_commits:
    - "6695d29b1c1ce979725816295a26ecc64ae0e927"   # Django main
    - "c2250cfb80e27cdf8d098428824da2800a18cadf"   # Django 3.0.x
    - "167699278806b21757104acf0ff0570f673d44c7"   # Django 2.2.x
    - "f1e3017aeaeddc590dcf2cf88511f3a726da73ca"   # Django 1.11.x
  affected_versions: "<1.11.29, <2.2.11, <3.0.4"
  description: >
    SQL injection via untrusted data used as a tolerance parameter in
    GIS functions and aggregates on Oracle. The tolerance value was
    interpolated into SQL without parameterization.
  vulnerable_pattern: >
    GIS aggregate/function calls with tolerance=user_input on Oracle
    backend. The tolerance float was formatted directly into SQL.
  detection_strategy: flow
  emend_rule: django-gis-tolerance-injection

- cve: CVE-2021-35042
  library: django
  component: QuerySet.order_by()
  repo: https://github.com/django/django
  fix_commits:
    - "a34a5f724c5d5adb2109374ba3989ebb7b11f81f"   # Django 3.2.5
    - "0bd57a879a0d54920bb9038a732645fb917040e9"   # Django 3.1.13
  affected_versions: "<3.1.13, <3.2.5"
  description: >
    SQL injection via QuerySet.order_by() when untrusted data is passed
    as column names. Allowed injection of arbitrary SQL through crafted
    field names containing SQL syntax.
  vulnerable_pattern: >
    queryset.order_by(user_input) where user_input comes from request
    parameters without validation against an allowlist.
  detection_strategy: flow
  emend_rule: django-order-by-user-input

- cve: CVE-2022-28346
  library: django
  component: QuerySet.annotate() / aggregate() / extra()
  repo: https://github.com/django/django
  fix_commits:
    - "93cae5cb2f9a4ef1514cf1a41f714fef08005200"   # Django main
    - "800828887a0509ad1162d6d407e94d8de7eafc60"   # Django 4.0.x
    - "2044dac5c6968441be6f534c4139bcf48c5c7e48"   # Django 3.2.x
    - "2c09e68ec911919360d5f8502cefc312f9e03c5d"   # Django 2.2.x
  affected_versions: "<2.2.28, <3.2.13, <4.0.4"
  description: >
    SQL injection via crafted dictionary expansion in column aliases
    passed to annotate(), aggregate(), and extra(). A dict like
    {"injected_sql AS 1; DROP TABLE--": Count("id")} could inject SQL.
  vulnerable_pattern: >
    queryset.annotate(**user_dict) or queryset.aggregate(**user_dict)
    where dict keys come from user input.
  detection_strategy: flow
  emend_rule: django-annotate-injection

- cve: CVE-2022-28347
  library: django
  component: QuerySet.explain()
  repo: https://github.com/django/django
  fix_commits:
    - "6723a26e59b0b5429a0c5873941e01a2e1bdbb81"   # Django main
    - "00b0fc50e1738c7174c495464a5ef069408a4402"   # Django 4.0.x
    - "9e19accb6e0a00ba77d5a95a91675bf18877c72d"   # Django 3.2.x
    - "29a6c98b4c13af82064f993f0acc6e8fafa4d3f5"   # Django 2.2.x
  affected_versions: "<2.2.28, <3.2.13, <4.0.4"
  description: >
    SQL injection via crafted option names in QuerySet.explain(**options).
    The option keys were interpolated into SQL without escaping, allowing
    injection through dict expansion with malicious keys.
  vulnerable_pattern: >
    queryset.explain(**user_dict) where dict keys contain injected SQL.
  detection_strategy: flow
  emend_rule: django-explain-injection

- cve: CVE-2022-34265
  library: django
  component: Trunc() and Extract() date functions
  repo: https://github.com/django/django
  fix_commits:
    - "54eb8a374d5d98594b264e8ec22337819b37443c"   # Django main
    - "284b188a4194e8fa5d72a73b09a869d7dd9f0dc5"   # Django 4.1.x
    - "0dc9c016fadb71a067e5a42be30164e3f96c0492"   # Django 4.0.x
    - "a9010fe5555e6086a9d9ae50069579400ef0685e"   # Django 3.2.x
  affected_versions: "<3.2.14, <4.0.6"
  description: >
    SQL injection via untrusted data used as a kind/lookup_name value in
    Trunc() and Extract() functions. These parameters were interpolated
    directly into SQL without validation.
  vulnerable_pattern: >
    Trunc('field', kind=user_input) or Extract('field', lookup_name=user_input)
    where the kind/lookup_name is user-controlled.
  detection_strategy: flow
  emend_rule: django-trunc-kind-injection

- cve: CVE-2024-42005
  library: django
  component: QuerySet.values() / values_list()
  repo: https://github.com/django/django
  fix_commits:
    - "c87bfaacf8fb84984243b5055dc70f97996cb115"   # Django main
    - "e2583fbc2ebffce11b4444a7cec6336513e81f8b"   # Django 5.1.x
    - "32ebcbf2e1fe3e5ba79a6554a167efce81f7422d"   # Django 5.0.x
    - "f4af67b9b41e0f4c117a8741da3abbd1c869ab28"   # Django 4.2.x
  affected_versions: "<4.2.15, <5.0.8"
  description: >
    SQL injection via crafted JSONField key names used as column aliases
    in values() and values_list(). Malicious keys could inject SQL through
    the field name parsing.
  vulnerable_pattern: >
    queryset.values(user_controlled_field) or
    queryset.values_list(user_controlled_field) on JSONField columns.
  detection_strategy: flow
  emend_rule: django-values-injection

- cve: CVE-2024-53908
  library: django
  component: HasKey lookup on Oracle
  repo: https://github.com/django/django
  fix_commits:
    - "8f8dc5a1fca7d076e749f307f6573af3512e7e99"   # Django main
    - "6943d61818e63e77b65d8b1ae65941e8f04bd87b"   # Django 5.1.x
    - "ff08bb6c70aa45f83a5ef3bd0b601c7c9d1a7642"   # Django 5.0.x
    - "7376bcbf508883282ffcc0f0fac5cf0ed2d6cbc5"   # Django 4.2.x
  affected_versions: "<4.2.17, <5.0.10, <5.1.4"
  description: >
    SQL injection in direct use of HasKey(lhs, rhs) lookup on Oracle.
    If untrusted data is used as the lhs value, it is not properly
    parameterized in Oracle's JSON_EXISTS() SQL generation. Standard ORM
    filter syntax (field__has_key=) is unaffected; only direct HasKey()
    instantiation is vulnerable.
  vulnerable_pattern: >
    HasKey(user_input, 'some_key') where the lhs is user-controlled.
    The lhs value is not parameterized in the Oracle SQL path.
  detection_strategy: flow
  emend_rule: null
  notes: >
    Oracle-specific. Only affects direct HasKey() instantiation, not
    the standard field__has_key=value ORM syntax.

# ==============================================================
# SQLAlchemy — automatic text coercion SQL injection
# ==============================================================

- cve: CVE-2019-7164
  library: sqlalchemy
  component: order_by() automatic text coercion
  repo: https://github.com/sqlalchemy/sqlalchemy
  fix_commits:
    - "30307c4616ad67c01ddae2e1e8e34fabf6028414"   # SQLAlchemy 1.2.18 / 1.3.0b3
  affected_versions: "<=1.2.17, 1.3.0b1-1.3.0b2"
  description: >
    SQL injection via the order_by parameter. SQLAlchemy silently coerced
    plain strings passed to order_by() into text() SQL fragments. If user
    input was passed directly, arbitrary SQL could be injected. The fix
    removes automatic textual coercion, requiring explicit text() for raw
    SQL strings.
  vulnerable_pattern: >
    session.query(User).order_by(user_input).all() where user_input is
    a raw string from request parameters. SQLAlchemy treated it as
    equivalent to order_by(text(user_input)).
  detection_strategy: flow
  emend_rule: null
  notes: >
    Critical (CVSS 9.3). Same fix as CVE-2019-7548. This was a design-level
    issue — the implicit text() coercion was a convenience feature that
    became a security hazard.

- cve: CVE-2019-7548
  library: sqlalchemy
  component: group_by() automatic text coercion
  repo: https://github.com/sqlalchemy/sqlalchemy
  fix_commits:
    - "30307c4616ad67c01ddae2e1e8e34fabf6028414"   # same fix as CVE-2019-7164
  affected_versions: "<=1.2.17"
  description: >
    SQL injection via the group_by parameter. Identical root cause to
    CVE-2019-7164: plain strings passed to group_by() were automatically
    coerced to text() SQL fragments without escaping. Same fix removes
    textual coercion from both group_by() and order_by().
  vulnerable_pattern: >
    session.query(User).group_by(user_input).all() where user_input
    is a raw string coerced to text().
  detection_strategy: flow
  emend_rule: null
  notes: >
    Same commit fixes both CVE-2019-7164 and CVE-2019-7548.

# ==============================================================
# Other Python libraries
# ==============================================================

- cve: CVE-2026-26198
  library: ormar
  component: QuerySet.min() / max() aggregate functions
  repo: https://github.com/collerek/ormar
  fix_commits:
    - "a03bae14fe01358d3eaf7e319fcd5db2e4956b16"   # ormar 0.23.0
  affected_versions: ">=0.9.9, <=0.22.0"
  description: >
    SQL injection through aggregate functions min() and max(). Unlike
    sum() and avg() which validate column names, min/max accepted
    arbitrary strings that were embedded directly into SQL queries via
    SQLAlchemy's func.min/func.max.
  vulnerable_pattern: >
    await Model.objects.min(user_input) or max(user_input) where the
    column name is user-controlled. The column was passed directly to
    sqlalchemy.func without validation.
  detection_strategy: structural
  emend_rule: null
  notes: >
    Interesting case: inconsistent validation across similar methods.
    sum() and avg() had type checks but min/max did not.

- cve: CVE-2025-65896
  library: asyncmy
  component: dict key escaping in query parameters
  repo: https://github.com/long2ice/asyncmy
  fix_commits:
    - "6c16f3ba5abeb03686043273fdb2daab7b3f82a7"   # post-0.2.10
  affected_versions: "<=0.2.10"
  description: >
    SQL injection via crafted dictionary keys when using dict-style
    parameterized queries. The dict keys (column names) were not
    properly escaped, allowing injection through keys like
    "col; DROP TABLE users--".
  vulnerable_pattern: >
    cursor.execute("INSERT INTO t ({keys}) VALUES ({values})", user_dict)
    where dict keys are interpolated without escaping.
  detection_strategy: structural
  emend_rule: null
  notes: >
    MySQL async driver. The dict key escaping gap is similar to Django's
    annotate/aggregate alias injection pattern.

- cve: GHSA-wq2g-r956-j8cc
  library: pg8000
  component: pg8000.native.literal()
  repo: https://codeberg.org/tlocke/pg8000
  fix_commits:
    - "8663c746b02286c32f19c385f0e2e5da9e4fa140"   # pg8000 1.31.5
  affected_versions: "<=1.31.4"
  description: >
    SQL injection via specially crafted Python list input to the
    pg8000.native.literal() function. The list serialization did not
    properly escape nested values, allowing injection.
  vulnerable_pattern: >
    pg8000.native.literal(user_controlled_list) where list elements
    contain SQL injection payloads.
  detection_strategy: structural
  emend_rule: null
  notes: >
    PostgreSQL pure-Python driver. The literal() function is used to
    format Python values into SQL-safe literals but failed on nested
    list structures.

- cve: GHSA-4h97-wpxp-3757
  library: langgraph-checkpoint-sqlite
  component: SQLite store filter operators
  repo: https://github.com/langchain-ai/langgraph
  fix_commits:
    - "bc9d45b476101e441cb1cc602dea03eb29232de4"   # langgraph 2.0.11
  affected_versions: "<=2.0.10"
  description: >
    SQL injection via filter operators ($eq, $ne, $gt, $lt, $gte, $lte)
    in the SQLite store. Direct string concatenation was used instead of
    parameterized queries, allowing arbitrary SQL execution.
  vulnerable_pattern: >
    store.search(filter={"key": {"$eq": user_input}}) where the filter
    operator values were concatenated into SQL strings.
  detection_strategy: structural
  emend_rule: null
  notes: >
    LLM framework checkpoint storage. Shows SQLi in AI/ML tooling - an
    emerging attack surface as LLM apps handle more user input.

- cve: CVE-2026-32611
  library: glances
  component: DuckDB export module
  repo: https://github.com/nicolargo/glances
  fix_commits:
    - "a56a5b78ef931b1d1391c9898bf735a5b4323ec9"   # Glances 4.5.3
    - "63b7da28895249d775202d639e5531ba63491a5c"
  affected_versions: "<4.5.3"
  description: >
    SQL injection in the DuckDB export module where table and column
    names derived from monitoring statistics were directly interpolated
    into SQL statements via f-strings. INSERT values used parameters
    but DDL/identifier names did not.
  vulnerable_pattern: >
    f"CREATE TABLE IF NOT EXISTS {table_name} ..." and
    f"INSERT INTO {table_name} ..." where table_name comes from
    monitoring stat names that could be attacker-influenced.
  detection_strategy: structural
  emend_rule: raw-sql-f-string
  notes: >
    Classic pattern: parameterized values but unparameterized identifiers.
    A previous fix for TimescaleDB was not applied to the DuckDB module.

- cve: CVE-2026-30930
  library: glances
  component: TimescaleDB export module
  repo: https://github.com/nicolargo/glances
  fix_commits: []  # See CVE-2026-32611 for related fix
  affected_versions: "<4.5.0"
  description: >
    SQL injection via process names in the TimescaleDB export module.
    Process names from the system are used as table/column identifiers
    in SQL statements without sanitization.
  vulnerable_pattern: >
    f"INSERT INTO {stat_name} ..." where stat_name includes process
    names that could contain SQL metacharacters.
  detection_strategy: structural
  emend_rule: raw-sql-f-string
  notes: >
    Second-order SQLi: the injection payload comes from process names
    on the system rather than direct HTTP input.
