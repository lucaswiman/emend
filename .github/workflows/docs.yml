name: Build and Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read package version
        run: |
          VERSION=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("rust/Cargo.toml").read_text())["package"]["version"])')
          echo "EMEND_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Sphinx dependencies
        # Docs are hand-authored RST; no autodoc import of emend needed,
        # so we skip the Rust/maturin build and install only the doc toolchain.
        run: pip install sphinx furo

      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_build/html'

  deploy:
    name: Deploy Documentation
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
