# Publishing is now handled by wheels.yml, which builds platform wheels
# for all supported Python versions (3.10–3.14t) and publishes them to PyPI
# as part of the same release workflow.
#
# This file is retained as a placeholder. To trigger a release:
#   1. Create and push a version tag: git tag v0.2.0 && git push --tags
#   2. Publish a GitHub Release from that tag
#   3. The wheels.yml workflow will automatically build and publish to PyPI
#
# Setup requirements for PyPI trusted publishing:
#   1. Configure trusted publishing on pypi.org for the "emend" project:
#      - Workflow file name: wheels.yml
#      - Environment name: pypi
#   2. Create a "pypi" environment in your repository settings with required
#      reviewers for manual approval before publishing.
