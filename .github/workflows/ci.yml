name: CI

on:
  push:
    branches: [main, feature]
  pull_request:
    branches: [main, feature]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14t', '3.15', '3.15t']
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: make test-ci

      - name: Check for dead code
        run: make deadcode

      - name: Check wheel and source distribution
        run: make test-package

  test-mcp:
    name: MCP (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.15', '3.15t']
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - name: Run MCP integration tests
        run: make test-mcp

  vim-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim

      - name: Run Vader tests
        run: cd vim && ./test/run_tests.sh
