name: CI

on:
  push:
    branches: [main, feature]
  pull_request:
    branches: [main, feature]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: make test
