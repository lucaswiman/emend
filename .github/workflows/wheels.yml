# Build and publish emend wheels on every GitHub release.
#
# The emend wheel bundles the compiled emend_core Rust extension (built via
# maturin) so users get a single, self-contained package with no extra
# binary dependency.
#
# Platforms built:
#   - Linux x86_64   (manylinux_2_28 for 3.10–3.14; host build for 3.13t/3.14t)
#   - Linux aarch64  (manylinux_2_28 for 3.10–3.14; native ARM runner for 3.13t/3.14t)
#   - macOS arm64    (Apple Silicon, 3.10–3.14 + free-threaded 3.13t/3.14t)
#   - macOS x86_64   (Intel, 3.10–3.14 + free-threaded 3.13t/3.14t)
#   - Windows x86_64 (3.10–3.14 + free-threaded 3.13t/3.14t)
#
# Free-threaded Python (3.13t, 3.14t) wheels enable the GIL-free speedups
# described in the installation docs.
#
# NOTE: python3.14 must NOT appear in the free-threaded interpreter list.
# The free-threaded 3.14t installation provides a python3.14 binary that is
# actually free-threaded (cp314t), so maturin would see two interpreters
# (python3.14 and python3.14t) resolving to the same ABI and fail with
# "Expected only one platform tag but found 2".  Non-free-threaded 3.14
# wheels are built in the manylinux jobs instead.

name: Build Wheels

on:
  release:
    types: [published]

jobs:
  # ── Linux x86_64: manylinux for 3.10–3.14 ────────────────────────────────
  linux-x86-manylinux:
    name: Linux x86_64 (manylinux, 3.10–3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Build manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          manylinux: auto
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-manylinux
          path: dist/*.whl

  # ── Linux x86_64: free-threaded 3.13t, 3.14t ──────────────────────────────
  linux-x86-freethread:
    name: Linux x86_64 (free-threaded 3.13t, 3.14t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14t
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          # Build on the host (no manylinux container) so the free-threaded
          # interpreters installed above are visible to maturin.
          manylinux: off
          args: >-
            --release --out dist
            --compatibility manylinux_2_28
            --interpreter python3.13t python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-freethread
          path: dist/*.whl

  # ── Linux aarch64: manylinux for 3.10–3.14 ────────────────────────────────
  linux-aarch64-manylinux:
    name: Linux aarch64 (manylinux, 3.10–3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Build manylinux aarch64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: auto
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64-manylinux
          path: dist/*.whl

  # ── Linux aarch64: free-threaded 3.13t, 3.14t ─────────────────────────────
  linux-aarch64-freethread:
    name: Linux aarch64 (free-threaded 3.13t, 3.14t)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14t
      - name: Build free-threaded aarch64 wheels
        uses: PyO3/maturin-action@v1
        with:
          manylinux: off
          args: >-
            --release --out dist
            --compatibility manylinux_2_28
            --interpreter python3.13t python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64-freethread
          path: dist/*.whl

  # ── macOS Apple Silicon (arm64): standard 3.10–3.14 ──────────────────────
  macos-arm:
    name: macOS arm64 (3.10–3.14)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build macOS arm64 wheels
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: dist/*.whl

  # ── macOS Apple Silicon (arm64): free-threaded 3.13t, 3.14t ────────────
  macos-arm-freethread:
    name: macOS arm64 (free-threaded 3.13t, 3.14t)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14t
      - name: Build macOS arm64 free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter python3.13t python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64-freethread
          path: dist/*.whl

  # ── macOS Intel (x86_64): standard 3.10–3.14 ────────────────────────────
  macos-intel:
    name: macOS x86_64 (3.10–3.14)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build macOS x86_64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-apple-darwin
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: dist/*.whl

  # ── macOS Intel (x86_64): free-threaded 3.13t, 3.14t ──────────────────
  macos-intel-freethread:
    name: macOS x86_64 (free-threaded 3.13t, 3.14t)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14t
      - name: Build macOS x86_64 free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-apple-darwin
          args: >-
            --release --out dist
            --interpreter python3.13t python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64-freethread
          path: dist/*.whl

  # ── Windows x86_64: standard 3.10–3.14 ──────────────────────────────────
  windows:
    name: Windows x86_64 (3.10–3.14)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build Windows wheels
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl

  # ── Windows x86_64: free-threaded 3.13t, 3.14t ────────────────────────
  windows-freethread:
    name: Windows x86_64 (free-threaded 3.13t, 3.14t)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14t
      - name: Build Windows free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter python3.13t python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64-freethread
          path: dist/*.whl

  # ── Source distribution ───────────────────────────────────────────────────
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Publish to PyPI ───────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs:
      - linux-x86-manylinux
      - linux-x86-freethread
      - linux-aarch64-manylinux
      - linux-aarch64-freethread
      - macos-arm
      - macos-arm-freethread
      - macos-intel
      - macos-intel-freethread
      - windows
      - windows-freethread
      - sdist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/emend
    permissions:
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
