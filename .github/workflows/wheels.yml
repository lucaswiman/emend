# Build and publish emend wheels on every GitHub release.
#
# The emend wheel bundles the compiled emend_core Rust extension (built via
# maturin) so users get a single, self-contained package with no extra
# binary dependency.
#
# Platforms built:
#   - Linux x86_64   (manylinux_2_28 for 3.10–3.14; manylinux_2_39 for 3.13t/3.14t)
#   - Linux aarch64  (manylinux_2_28 for 3.10–3.14; manylinux_2_39 for 3.13t/3.14t)
#   - macOS arm64    (Apple Silicon, 3.10–3.14 + free-threaded 3.13t/3.14t)
#   - macOS x86_64   (Intel, 3.10–3.14 + free-threaded 3.13t/3.14t)
#   - Windows x86_64 (3.10–3.14 + free-threaded 3.13t/3.14t)
#
# Free-threaded Python (3.13t, 3.14t) wheels enable the GIL-free speedups
# described in the installation docs.
#
# NOTE: Each free-threaded interpreter must be built in its own maturin
# invocation because each free-threaded ABI (cp313t, cp314t) produces a
# distinct platform tag and maturin expects exactly one.  The matrix
# strategy below ensures one maturin call per interpreter.
#
# Free-threaded interpreters are pre-installed inside the manylinux
# containers at /opt/python/cp<ver>t-cp<ver>t/bin/python<ver>t, so no
# setup-python step or host build is needed.

name: Build Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ── Linux x86_64: manylinux for 3.10–3.14 ────────────────────────────────
  linux-x86-manylinux:
    name: Linux x86_64 (manylinux, 3.10–3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Build manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          manylinux: auto
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-manylinux
          path: dist/*.whl

  # ── Linux x86_64: free-threaded (one job per interpreter) ──────────────────
  linux-x86-freethread:
    name: Linux x86_64 (free-threaded ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          # Build on the host (no Docker) because maturin inside the
          # manylinux container treats free-threaded interpreters like
          # python3.13t as cross-compilation and rejects the 't' suffix.
          # manylinux_2_39 matches the Ubuntu 24.04 runner's glibc.
          container: off
          args: >-
            --release --out dist
            --compatibility manylinux_2_39
            --interpreter python${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-freethread-${{ matrix.python-version }}
          path: dist/*.whl

  # ── Linux aarch64: manylinux for 3.10–3.14 ────────────────────────────────
  linux-aarch64-manylinux:
    name: Linux aarch64 (manylinux, 3.10–3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Build manylinux aarch64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: auto
          before-script-linux: export CFLAGS_aarch64_unknown_linux_gnu="-std=gnu99"
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64-manylinux
          path: dist/*.whl

  # ── Linux aarch64: free-threaded (one job per interpreter) ─────────────────
  linux-aarch64-freethread:
    name: Linux aarch64 (free-threaded ${{ matrix.python-version }})
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build free-threaded aarch64 wheels
        uses: PyO3/maturin-action@v1
        with:
          # Build on the host (no Docker) because maturin inside the
          # manylinux container treats this as cross-compilation and can't
          # parse the 't' suffix in interpreter names like python3.14t.
          # manylinux_2_39 matches the Ubuntu 24.04 ARM runner's glibc.
          container: off
          args: >-
            --release --out dist
            --compatibility manylinux_2_39
            --interpreter python${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64-freethread-${{ matrix.python-version }}
          path: dist/*.whl

  # ── macOS Apple Silicon (arm64): standard 3.10–3.14 ──────────────────────
  macos-arm:
    name: macOS arm64 (3.10–3.14)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build macOS arm64 wheels
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: dist/*.whl

  # ── macOS Apple Silicon (arm64): free-threaded (one job per interpreter) ──
  macos-arm-freethread:
    name: macOS arm64 (free-threaded ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build macOS arm64 free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter python${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64-freethread-${{ matrix.python-version }}
          path: dist/*.whl

  # ── macOS Intel (x86_64): standard 3.10–3.14 ────────────────────────────
  macos-intel:
    name: macOS x86_64 (3.10–3.14)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build macOS x86_64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-apple-darwin
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: dist/*.whl

  # ── macOS Intel (x86_64): free-threaded (one job per interpreter) ────────
  macos-intel-freethread:
    name: macOS x86_64 (free-threaded ${{ matrix.python-version }})
    runs-on: macos-15
    strategy:
      matrix:
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build macOS x86_64 free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-apple-darwin
          args: >-
            --release --out dist
            --interpreter python${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64-freethread-${{ matrix.python-version }}
          path: dist/*.whl

  # ── Windows x86_64: standard 3.10–3.14 ──────────────────────────────────
  windows:
    name: Windows x86_64 (3.10–3.14)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build Windows wheels
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.14
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl

  # ── Windows x86_64: free-threaded (one job per interpreter) ──────────────
  windows-freethread:
    name: Windows x86_64 (free-threaded ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.13t', '3.14t']
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build Windows free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter python${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64-freethread-${{ matrix.python-version }}
          path: dist/*.whl

  # ── Source distribution ───────────────────────────────────────────────────
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          for f in rust/Cargo.toml rust/pyproject.toml; do
            sed "s/^version = .*/version = \"$VERSION\"/" "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
          grep '^version' rust/Cargo.toml rust/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Publish to PyPI ───────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs:
      - linux-x86-manylinux
      - linux-x86-freethread
      - linux-aarch64-manylinux
      - linux-aarch64-freethread
      - macos-arm
      - macos-arm-freethread
      - macos-intel
      - macos-intel-freethread
      - windows
      - windows-freethread
      - sdist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/emend
    permissions:
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
