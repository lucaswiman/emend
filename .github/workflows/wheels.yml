# Build and publish emend wheels on every GitHub release.
#
# The emend wheel bundles the compiled emend_core Rust extension (built via
# maturin) so users get a single, self-contained package with no extra
# binary dependency.
#
# Platforms built:
#   - Linux x86_64   (manylinux_2_28 for 3.10–3.13; host build for 3.13t/3.14/3.14t)
#   - Linux aarch64  (manylinux_2_28 for 3.10–3.13; native ARM runner for 3.13t/3.14/3.14t)
#   - macOS arm64    (Apple Silicon, all versions)
#   - macOS x86_64   (Intel, all versions)
#   - Windows x86_64 (all versions)
#
# Free-threaded Python (3.13t, 3.14t) wheels enable the GIL-free speedups
# described in the installation docs.

name: Build Wheels

on:
  release:
    types: [published]

jobs:
  # ── Linux x86_64: manylinux for 3.10–3.13 ────────────────────────────────
  linux-x86-manylinux:
    name: Linux x86_64 (manylinux, 3.10–3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/^version = .*/version = \"$VERSION\"/" rust/Cargo.toml > rust/Cargo.toml.tmp
          mv rust/Cargo.toml.tmp rust/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Build manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          manylinux: auto
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-manylinux
          path: dist/*.whl

  # ── Linux x86_64: free-threaded + Python 3.14 ─────────────────────────────
  linux-x86-freethread:
    name: Linux x86_64 (free-threaded 3.13t, 3.14, 3.14t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/^version = .*/version = \"$VERSION\"/" rust/Cargo.toml > rust/Cargo.toml.tmp
          mv rust/Cargo.toml.tmp rust/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14
            3.14t
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          # Build on the host (no manylinux container) so the free-threaded
          # interpreters installed above are visible to maturin.
          manylinux: off
          args: >-
            --release --out dist
            --interpreter python3.13t python3.14 python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-freethread
          path: dist/*.whl

  # ── Linux aarch64: manylinux for 3.10–3.13 ────────────────────────────────
  linux-aarch64-manylinux:
    name: Linux aarch64 (manylinux, 3.10–3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/^version = .*/version = \"$VERSION\"/" rust/Cargo.toml > rust/Cargo.toml.tmp
          mv rust/Cargo.toml.tmp rust/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Build manylinux aarch64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: auto
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64-manylinux
          path: dist/*.whl

  # ── Linux aarch64: free-threaded + Python 3.14 ────────────────────────────
  linux-aarch64-freethread:
    name: Linux aarch64 (free-threaded 3.13t, 3.14, 3.14t)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/^version = .*/version = \"$VERSION\"/" rust/Cargo.toml > rust/Cargo.toml.tmp
          mv rust/Cargo.toml.tmp rust/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14
            3.14t
      - name: Build free-threaded aarch64 wheels
        uses: PyO3/maturin-action@v1
        with:
          manylinux: off
          args: >-
            --release --out dist
            --interpreter python3.13t python3.14 python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64-freethread
          path: dist/*.whl

  # ── macOS Apple Silicon (arm64) ───────────────────────────────────────────
  macos-arm:
    name: macOS arm64 (all Python versions)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/^version = .*/version = \"$VERSION\"/" rust/Cargo.toml > rust/Cargo.toml.tmp
          mv rust/Cargo.toml.tmp rust/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.13t
            3.14
            3.14t
      - name: Build macOS arm64 wheels
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.13t python3.14 python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: dist/*.whl

  # ── macOS Intel (x86_64) ──────────────────────────────────────────────────
  macos-intel:
    name: macOS x86_64 (all Python versions)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/^version = .*/version = \"$VERSION\"/" rust/Cargo.toml > rust/Cargo.toml.tmp
          mv rust/Cargo.toml.tmp rust/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.13t
            3.14
            3.14t
      - name: Build macOS x86_64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-apple-darwin
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.13t python3.14 python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: dist/*.whl

  # ── Windows x86_64 ───────────────────────────────────────────────────────
  windows:
    name: Windows x86_64 (all Python versions)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/^version = .*/version = \"$VERSION\"/" rust/Cargo.toml > rust/Cargo.toml.tmp
          mv rust/Cargo.toml.tmp rust/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.13t
            3.14
            3.14t
      - name: Build Windows wheels
        uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter python3.10 python3.11 python3.12 python3.13 python3.13t python3.14 python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist/*.whl

  # ── Source distribution ───────────────────────────────────────────────────
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/^version = .*/version = \"$VERSION\"/" rust/Cargo.toml > rust/Cargo.toml.tmp
          mv rust/Cargo.toml.tmp rust/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Publish to PyPI ───────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs:
      - linux-x86-manylinux
      - linux-x86-freethread
      - linux-aarch64-manylinux
      - linux-aarch64-freethread
      - macos-arm
      - macos-intel
      - windows
      - sdist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/emend
    permissions:
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
