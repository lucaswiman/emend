# TypeScript language configuration for emend scope resolver.

[language]
name = "typescript"
tree_sitter_grammar = "tree-sitter-typescript"
file_extensions = ["ts", "tsx", "js", "jsx"]
keywords = ["undefined", "null", "true", "false"]

[scoping]
[[scoping.scope_creators]]
node = "program"
kind = "module"

[[scoping.scope_creators]]
node = "function_declaration"
kind = "function"

[[scoping.scope_creators]]
node = "arrow_function"
kind = "function"

[[scoping.scope_creators]]
node = "class_declaration"
kind = "class"

[[scoping.scope_creators]]
node = "method_definition"
kind = "function"

[[scoping.scope_creators]]
node = "function_expression"
kind = "function"

[scoping.rules.class]
is_closure_boundary = false
names_visible_to_inner = true

[scoping.rules.function]
is_closure_boundary = false
names_visible_to_inner = true

[scoping.rules.module]
is_closure_boundary = false
names_visible_to_inner = true

[scoping.declarations]
# TypeScript/JS scoping is complex due to var vs let/const, 
# but for QN resolution we mostly care about top-level and class members.

[bindings]
[[bindings.assignment]]
node = "variable_declarator"
target = "name"

[[bindings.assignment]]
node = "assignment_expression"
target = "left"

[[bindings.loop]]
node = "for_in_statement"
target = "left"

[[bindings.loop]]
node = "for_of_statement"
target = "left"

[bindings.parameters]
param_nodes = ["identifier", "required_parameter", "optional_parameter"]
name_field = "name"

[bindings.definitions]
function_def = "function_declaration"
class_def = "class_declaration"
name_field = "name"

[imports]
import_statement = "import_statement"
module_field = "source"
name_field = "import_clause"
# Node.js resolution strategy
resolution = "node"

[qualified_names]
module_separator = "/"
class_member_prefix = true
nested_function_prefix = false
locals_marker = ""

[exports]
export_statement = "export_statement"
public_by_default = false
private_prefix = "_"

[symbols]
function_node = "function_declaration"
class_node = "class_declaration"
# TypeScript has no decorated_definition wrapper; decorators are direct children
decorated_node = ""
definition_field = ""
async_keyword = "async"
name_field = "name"
parameters_field = "formal_parameters"
return_type_field = "type_annotation"
body_field = "statement_block"
superclasses_field = "class_heritage"
decorator_node = "decorator"
expression_statement_node = "expression_statement"
# Inside class bodies, methods are method_definition nodes
method_node = "method_definition"

[[symbols.param_types]]
node = "required_parameter"
name_source = "field:pattern"
[[symbols.param_types]]
node = "optional_parameter"
name_source = "field:pattern"
[[symbols.param_types]]
node = "rest_pattern"
name_source = "child:0"
prefix = "..."
[[symbols.param_types]]
node = "identifier"
name_source = "self"

[symbols.statements]
simple = [
    "expression_statement", "return_statement", "throw_statement",
    "break_statement", "continue_statement", "import_statement",
    "export_statement", "debugger_statement",
    "lexical_declaration", "variable_declaration",
]
compound = [
    "if_statement", "for_statement", "while_statement", "try_statement",
    "for_in_statement", "for_of_statement",
    "function_declaration", "class_declaration",
    "switch_statement",
]
recurse_into = [
    "statement_block", "program", "else_clause",
    "catch_clause", "finally_clause", "switch_body", "switch_case",
]

[builtins]
names = [
    "console", "window", "document", "process", "require", "module", "exports",
    "Array", "Object", "String", "Number", "Boolean", "Math", "JSON", "Promise",
    "Error", "Set", "Map", "setTimeout", "setInterval", "clearTimeout", "clearInterval"
]
