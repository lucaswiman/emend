# TypeScript language configuration for emend scope resolver.

[language]
name = "typescript"
tree_sitter_grammar = "tree-sitter-typescript"
file_extensions = ["ts", "tsx", "js", "jsx"]
comment_prefix = "//"
keywords = ["undefined", "null", "true", "false"]

[scoping]
[[scoping.scope_creators]]
node = "program"
kind = "module"

[[scoping.scope_creators]]
node = "function_declaration"
kind = "function"

[[scoping.scope_creators]]
node = "arrow_function"
kind = "function"

[[scoping.scope_creators]]
node = "class_declaration"
kind = "class"

[[scoping.scope_creators]]
node = "method_definition"
kind = "function"

[[scoping.scope_creators]]
node = "function_expression"
kind = "function"

[scoping.rules.class]
is_closure_boundary = false
names_visible_to_inner = true

[scoping.rules.function]
is_closure_boundary = false
names_visible_to_inner = true

[scoping.rules.module]
is_closure_boundary = false
names_visible_to_inner = true

[scoping.declarations]
# TypeScript/JS scoping is complex due to var vs let/const, 
# but for QN resolution we mostly care about top-level and class members.

[bindings]
[[bindings.assignment]]
node = "variable_declarator"
target = "name"

[[bindings.assignment]]
node = "assignment_expression"
target = "left"

[[bindings.loop]]
node = "for_in_statement"
target = "left"

[[bindings.loop]]
node = "for_of_statement"
target = "left"

[bindings.parameters]
param_nodes = ["identifier", "required_parameter", "optional_parameter"]
name_field = "name"

[bindings.definitions]
function_def = "function_declaration"
class_def = "class_declaration"
name_field = "name"

[imports]
import_statement = "import_statement"
module_field = "source"
name_field = "import_clause"
# Node.js resolution strategy
resolution = "node"
dotted_name = "identifier"
aliased_import = "import_alias"
identifier = "identifier"

[qualified_names]
module_separator = "/"
class_member_prefix = true
nested_function_prefix = false
locals_marker = ""

[exports]
export_statement = "export_statement"
public_by_default = false
private_prefix = "_"

[symbols]
function_node = "function_declaration"
class_node = "class_declaration"
# TypeScript has no decorated_definition wrapper; decorators are direct children
decorated_node = ""
definition_field = ""
async_keyword = "async"
name_field = "name"
parameters_field = "formal_parameters"
return_type_field = "type_annotation"
body_field = "statement_block"
superclasses_field = "class_heritage"
decorator_node = "decorator"
expression_statement_node = "expression_statement"
# Inside class bodies, methods are method_definition nodes
method_node = "method_definition"

[[symbols.param_types]]
node = "required_parameter"
name_source = "field:pattern"
[[symbols.param_types]]
node = "optional_parameter"
name_source = "field:pattern"
[[symbols.param_types]]
node = "rest_pattern"
name_source = "child:0"
prefix = "..."
[[symbols.param_types]]
node = "identifier"
name_source = "self"

[symbols.statements]
simple = [
    "expression_statement", "return_statement", "throw_statement",
    "break_statement", "continue_statement", "import_statement",
    "export_statement", "debugger_statement",
    "lexical_declaration", "variable_declaration",
]
compound = [
    "if_statement", "for_statement", "while_statement", "try_statement",
    "for_in_statement", "for_of_statement",
    "function_declaration", "class_declaration",
    "switch_statement",
]
recurse_into = [
    "statement_block", "program", "else_clause",
    "catch_clause", "finally_clause", "switch_body", "switch_case",
]

# ---------------------------------------------------------------------------
# Environment path symbol lookup
# ---------------------------------------------------------------------------
[environment_lookup]
# Enable looking up symbols in node_modules when they are not found in the project.
# When a symbol cannot be found in the project, emend will search these
# directories (relative to project root) for installed package sources.
enabled = true
# Directories to probe (first match wins). node_modules is the standard location
# for npm packages, and it's skipped by default file scanning, so this is the
# only way to reach installed package sources.
paths = ["node_modules"]

[builtins]
names = [
    "console", "window", "document", "process", "require", "module", "exports",
    "Array", "Object", "String", "Number", "Boolean", "Math", "JSON", "Promise",
    "Error", "Set", "Map", "setTimeout", "setInterval", "clearTimeout", "clearInterval"
]

[pattern_matching]
function_def = "function_declaration"
class_def = "class_declaration"
decorated_def = ""
call = "call_expression"
attribute = "member_expression"
identifier = "identifier"
assignment = "assignment_expression"
augmented_assignment = "augmented_assignment_expression"
annotated_assignment = "variable_declarator"
return_stmt = "return_statement"
if_stmt = "if_statement"
while_stmt = "while_statement"
for_stmt = "for_statement"
with_stmt = ""
try_stmt = "try_statement"
except_handler = "catch_clause"
for_in_clause = "for_in_statement"
if_clause = ""
pair = "pair"
import_stmt = "import_statement"
import_from_stmt = "import_statement"
assert_stmt = ""
raise_stmt = "throw_statement"
delete_stmt = ""
global_stmt = ""
nonlocal_stmt = ""
await_expr = "await_expression"
yield_expr = "yield_expression"
lambda = "arrow_function"
named_expr = ""
integer = "number"
float = "number"
string = "string"
list = "array"
tuple = "array"
set = ""
dict = "object"
binary_operator = "binary_expression"
boolean_operator = "binary_expression"
unary_operator = "unary_expression"
comparison_operator = "binary_expression"
subscript = "subscript_expression"
keyword_argument = ""
list_splat = "spread_element"
dictionary_splat = "spread_element"
statement_nodes = [
    "expression_statement", "return_statement", "if_statement",
    "for_statement", "while_statement", "try_statement",
    "with_statement", "function_declaration", "class_declaration",
    "assignment_expression", "augmented_assignment_expression",
    "import_statement", "throw_statement",
]
func_field = "function"
args_field = "arguments"
object_field = "object"
attr_field = "property"
left_field = "left"
right_field = "right"
operator_field = "operator"
annotation_field = "type"
value_field = "value"
condition_field = "condition"
target_field = "left"
iter_field = "right"
elt_field = "body"
