# TypeScript language configuration for emend scope resolver.
#
# This file defines scoping rules, binding conventions, import resolution,
# and qualified name construction for TypeScript/JavaScript.

[language]
name = "typescript"
tree_sitter_grammar = "tree-sitter-typescript"
file_extensions = ["ts", "tsx", "js", "jsx", "mjs", "cjs"]

# ---------------------------------------------------------------------------
# Scoping rules
# ---------------------------------------------------------------------------
[scoping]

[[scoping.scope_creators]]
node = "program"
kind = "module"

[[scoping.scope_creators]]
node = "function_declaration"
kind = "function"

[[scoping.scope_creators]]
node = "arrow_function"
kind = "function"

[[scoping.scope_creators]]
node = "function_expression"
kind = "function"

[[scoping.scope_creators]]
node = "method_definition"
kind = "function"

[[scoping.scope_creators]]
node = "class_declaration"
kind = "class"

[[scoping.scope_creators]]
node = "class_expression"
kind = "class"

# Block scoping for let/const (but not var)
[[scoping.scope_creators]]
node = "statement_block"
kind = "block"

[[scoping.scope_creators]]
node = "for_statement"
kind = "block"

[[scoping.scope_creators]]
node = "for_in_statement"
kind = "block"

[scoping.rules.class]
# TypeScript classes DO participate in closure (unlike Python)
is_closure_boundary = false
names_visible_to_inner = true

[scoping.rules.function]
is_closure_boundary = false
names_visible_to_inner = true

[scoping.rules.block]
is_closure_boundary = false
names_visible_to_inner = true

[scoping.rules.module]
is_closure_boundary = false
names_visible_to_inner = true

[scoping.declarations]
# var is function-scoped (hoisted to nearest function or module)
# let/const are block-scoped
var_scope = "function"
let_scope = "block"
const_scope = "block"

# ---------------------------------------------------------------------------
# Binding rules
# ---------------------------------------------------------------------------
[bindings]

[[bindings.assignment]]
node = "assignment_expression"
target = "left"

[[bindings.assignment]]
node = "variable_declarator"
target = "name"

# Destructuring
[bindings.destructuring]
nodes = ["object_pattern", "array_pattern"]
# Destructured identifiers are recursively extracted

[bindings.parameters]
param_nodes = [
    "identifier",
    "required_parameter",
    "optional_parameter",
    "rest_pattern",
]
name_field = "name"

[bindings.definitions]
function_def = "function_declaration"
class_def = "class_declaration"
name_field = "name"

# ---------------------------------------------------------------------------
# Import resolution
# ---------------------------------------------------------------------------
[imports]
import_statement = "import_statement"
module_field = "source"
name_field = "import_clause"
alias_field = "alias"

resolution = "node"

[imports.node_options]
package_json = "package.json"
# Extension resolution order
extensions = [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"]
index_files = ["index.ts", "index.tsx", "index.js"]

# ---------------------------------------------------------------------------
# Qualified name construction
# ---------------------------------------------------------------------------
[qualified_names]
module_separator = "/"
class_member_prefix = true
nested_function_prefix = false  # JS doesn't use <locals> convention

# ---------------------------------------------------------------------------
# Export rules
# ---------------------------------------------------------------------------
[exports]
export_statement = "export_statement"
default_export = "export_default_declaration"
# In TS/JS, nothing is public unless explicitly exported
public_by_default = false
